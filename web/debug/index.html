<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Halo Scraper — Debug</title>
    <link rel="stylesheet" href="/ui/style.css" />
    <style>
      /* ── Page Layout ─────────────────────────────────────────────────────────── */
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #hdr {
        flex: 0 0 auto;
      }
      #tabbar {
        flex: 0 0 auto;
      }
      #main {
        flex: 1 1 0;
        display: flex;
        overflow: hidden;
      }

      /* ── Header ──────────────────────────────────────────────────────────────── */
      #hdr {
        background: #0a0a14;
        border-bottom: 1px solid var(--border);
        padding: 5px 10px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #hdr h1 {
        font-size: 13px;
        letter-spacing: 1px;
        color: var(--gold);
        text-transform: uppercase;
        white-space: nowrap;
      }
      .ws-dot {
        font-size: 11px;
      }
      .ws-dot.ok {
        color: var(--green);
      }
      .ws-dot.err {
        color: var(--red);
      }
      #msg-rate {
        color: var(--dim);
        font-size: 11px;
      }
      #last-msg {
        color: var(--dim);
        font-size: 11px;
        margin-left: auto;
      }

      /* ── Tab Bar ─────────────────────────────────────────────────────────────── */
      #tabbar {
        background: #0a0a14;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-end;
        padding: 0 8px;
        gap: 2px;
        overflow-x: auto;
      }
      .tab-btn {
        flex-shrink: 0;
        padding: 5px 12px;
        font-size: 11px;
        font-family: var(--font);
        background: transparent;
        border: 1px solid transparent;
        border-bottom: none;
        color: var(--dim);
        cursor: pointer;
        border-radius: 3px 3px 0 0;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .tab-btn:hover {
        color: var(--text);
        background: var(--card);
      }
      .tab-btn.active {
        background: var(--card);
        border-color: var(--border);
        color: var(--gold);
      }

      /* ── Panels ──────────────────────────────────────────────────────────────── */
      .panel {
        display: none;
        flex: 1 1 0;
        overflow: hidden;
      }
      .panel.active {
        display: flex;
      }

      /* ── All Panel — Mini Cards ──────────────────────────────────────────────── */
      #mini-grid {
        flex: 1 1 0;
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px;
        align-content: flex-start;
      }
      .mini-card {
        flex: 0 0 220px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .mini-card:hover {
        border-color: #5a5a8a;
      }
      .mc-name {
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 5px;
      }
      .mc-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
      }
      .mc-map {
        font-size: 11px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .mc-info {
        font-size: 10px;
        color: var(--dim);
      }
      .mc-scores {
        font-size: 11px;
        margin-top: 4px;
      }

      /* ── State Badges ────────────────────────────────────────────────────────── */
      .badge {
        font-size: 9px;
        font-weight: bold;
        padding: 1px 5px;
        border-radius: 3px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .badge-menu {
        background: #252535;
        color: var(--dim);
      }
      .badge-pregame {
        background: #2e2a10;
        color: var(--yellow);
      }
      .badge-in_game {
        background: #102e18;
        color: var(--green);
      }
      .badge-postgame {
        background: #2e1a10;
        color: var(--orange);
      }

      /* ── Log Panel ───────────────────────────────────────────────────────────── */
      .log-panel {
        flex: 0 0 300px;
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .log-hdr {
        flex: 0 0 auto;
        background: var(--card2);
        border-bottom: 1px solid var(--border);
        padding: 4px 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--dim);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .log-count {
        margin-left: auto;
      }
      .log-list {
        flex: 1 1 0;
        overflow-y: auto;
      }
      .log-entry {
        padding: 2px 8px;
        font-size: 10px;
        line-height: 1.55;
        border-bottom: 1px solid #141420;
        display: flex;
        gap: 5px;
        align-items: baseline;
      }
      .log-entry:hover {
        background: #161622;
      }
      .log-tick {
        color: var(--dim);
        flex-shrink: 0;
        min-width: 50px;
        font-size: 9px;
      }
      .log-type {
        flex-shrink: 0;
        min-width: 80px;
        font-size: 9px;
      }
      .log-desc {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ev-kill {
        color: var(--red);
      }
      .ev-death {
        color: var(--orange);
      }
      .ev-spawn {
        color: var(--green);
      }
      .ev-damage {
        color: var(--yellow);
      }
      .ev-melee {
        color: #e060c0;
      }
      .ev-team_kill {
        color: #e09040;
      }
      .ev-score {
        color: var(--dim);
      }
      .ev-item_picked_up {
        color: var(--blue);
      }
      .ev-item_dropped {
        color: #7090e0;
      }
      .ev-item_spawned {
        color: #5070c0;
      }
      .ev-item_depleted {
        color: #4060a0;
      }
      .ev-grenade_thrown {
        color: #a0b080;
      }
      .ev-powerup_picked_up {
        color: var(--purple);
      }
      .ev-powerup_expired {
        color: #8040c0;
      }
      .ev-vehicle_entered {
        color: var(--cyan);
      }
      .ev-vehicle_exited {
        color: #30a8a0;
      }
      .ev-player_quit {
        color: var(--dim);
      }
      .ev-multikill {
        color: var(--gold);
      }
      .ev-kill_streak {
        color: var(--gold);
      }
      .ev-game_start {
        color: var(--gold);
      }
      .ev-game_end {
        color: var(--gold);
      }

      /* ── Host Panel Layout ───────────────────────────────────────────────────── */
      .host-panel {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 0;
      }
      .inst-hdr {
        flex: 0 0 auto;
        background: var(--card2);
        border-bottom: 1px solid var(--border);
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inst-name {
        font-size: 11px;
        color: var(--dim);
      }
      .inst-map {
        font-size: 11px;
        color: var(--text);
      }
      .inst-type {
        font-size: 10px;
        color: var(--cyan);
      }
      .inst-tick {
        font-size: 10px;
        color: var(--dim);
        margin-left: auto;
      }
      .host-body {
        flex: 1 1 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      /* ── Team Area ───────────────────────────────────────────────────────────── */
      .team-area {
        flex: 0 0 auto;
        display: flex;
        border-bottom: 1px solid var(--border);
      }
      .team-col {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
      }
      .team-col + .team-col {
        border-left: 1px solid var(--border);
      }
      .team-hdr {
        padding: 3px 6px;
        font-size: 11px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .team-hdr.red {
        background: #1a0808;
        color: var(--red);
        border-bottom: 1px solid #3a1515;
      }
      .team-hdr.blue {
        background: #080f1a;
        color: var(--blue);
        border-bottom: 1px solid #153060;
      }
      .team-hdr.ffa {
        background: var(--card2);
        color: var(--dim);
        border-bottom: 1px solid var(--border);
      }
      .team-score {
        margin-left: auto;
        font-size: 13px;
      }

      /* ── Player Table ────────────────────────────────────────────────────────── */
      .ptable {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      .ptable th {
        font-size: 9px;
        text-transform: uppercase;
        color: var(--dim);
        padding: 2px 3px;
        text-align: left;
        background: var(--card2);
        border-bottom: 1px solid var(--border);
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      .ptable td {
        padding: 2px 3px;
        vertical-align: middle;
        border-bottom: 1px solid #1c1c2a;
        white-space: nowrap;
        overflow: hidden;
      }
      .ptable tr.empty td {
        opacity: 0.1;
      }
      .ptable tr.dead td {
        opacity: 0.5;
      }
      .ptable tr.dead .p-name {
        text-decoration: line-through;
      }

      .col-num {
        width: 18px;
      }
      .col-dot {
        width: 12px;
      }
      .col-name {
        width: 75px;
      }
      .col-hpsh {
        width: 88px;
      }
      .col-kda {
        width: 56px;
      }
      .col-tk {
        width: 24px;
      }
      .col-sui {
        width: 24px;
      }
      .col-ctf {
        width: 24px;
      }
      .col-ks {
        width: 24px;
      }
      .col-mk {
        width: 24px;
      }
      .col-acc {
        width: 36px;
      }
      .col-wpn {
        width: 82px;
      }
      .col-nd {
        width: 26px;
      }
      .col-fl {
        width: 96px;
      }

      .p-num {
        font-size: 10px;
        color: var(--dim);
      }
      .p-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .p-dot.alive {
        background: var(--green);
      }
      .p-dot.dead {
        background: var(--red);
        opacity: 0.5;
      }
      .p-name {
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }
      .p-name.red {
        color: var(--red);
      }
      .p-name.blue {
        color: var(--blue);
      }
      .p-name.none {
        color: var(--text);
      }

      /* HP/SH stacked bars */
      .hpsh-wrap {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .bar-wrap {
        flex: 1;
        height: 4px;
        background: #252535;
        border-radius: 2px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.1s;
      }
      .bar-val {
        font-size: 9px;
        color: var(--dim);
        min-width: 22px;
        text-align: right;
        flex-shrink: 0;
      }
      .hp-hi {
        background: #40cc60;
      }
      .hp-mid {
        background: #c8b030;
      }
      .hp-lo {
        background: #c83030;
      }
      .sh-bar {
        background: #3a80d0;
      }
      .sh-ov {
        background: #8840d0;
      }

      /* KDA */
      .kda-cell {
        font-size: 10px;
        letter-spacing: -0.3px;
      }
      .kda-k {
        color: var(--green);
      }
      .kda-d {
        color: var(--red);
      }
      .kda-a {
        color: var(--dim);
      }

      /* Weapon */
      .wpn-cell {
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
      }
      .wpn-name {
        color: var(--text);
      }
      .wpn-name.sel {
        color: var(--gold);
      }
      .wpn-ammo {
        color: var(--dim);
      }
      .wpn-empty-txt {
        color: #3a3a50;
      }

      /* Nades */
      .nd-cell {
        font-size: 10px;
        letter-spacing: -0.3px;
      }
      .nd-frag {
        color: #c0a840;
      }
      .nd-sep {
        color: var(--dim);
      }
      .nd-plasma {
        color: #60a8e0;
      }

      /* Action flags */
      .fl-cell {
        display: flex;
        flex-wrap: wrap;
        gap: 1px;
      }
      .fl {
        display: none;
        font-size: 8px;
        padding: 0 2px;
        border-radius: 2px;
        line-height: 1.5;
      }
      .fl.on {
        display: inline;
      }
      .fl-cr {
        color: var(--cyan);
      }
      .fl-ju {
        color: var(--green);
      }
      .fl-fi {
        color: var(--yellow);
      }
      .fl-sh {
        color: var(--red);
      }
      .fl-flt {
        color: var(--yellow);
      }
      .fl-gr {
        color: #a0b080;
      }
      .fl-me {
        color: #e060c0;
      }
      .fl-ac {
        color: var(--cyan);
      }
      .fl-ha {
        color: var(--gold);
      }
      .fl-cam {
        color: var(--purple);
      }
      .fl-os {
        color: #8840d0;
      }
      .fl-zm {
        color: var(--cyan);
      }

      /* ── Power Items ─────────────────────────────────────────────────────────── */
      .power-section {
        flex: 0 0 auto;
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        min-height: 28px;
      }
      .pi-label {
        font-size: 9px;
        color: var(--dim);
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .pi-badge {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 10px;
        border: 1px solid transparent;
      }
      .pi-badge.world {
        background: #0f2b1a;
        border-color: #1a4a2a;
      }
      .pi-badge.held {
        background: #2a2500;
        border-color: #4a4000;
      }
      .pi-badge.respawning {
        background: #2b0f0f;
        border-color: #4a1a1a;
      }
      .pi-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .pi-badge.world .pi-dot {
        background: var(--green);
      }
      .pi-badge.held .pi-dot {
        background: var(--yellow);
      }
      .pi-badge.respawning .pi-dot {
        background: var(--red);
      }
      .pi-name {
        color: var(--text);
      }
      .pi-info {
        color: var(--dim);
        font-size: 9px;
      }

      /* ── Bottom Row — Minimap + Raw JSON ─────────────────────────────────────── */
      .bottom-row {
        flex: 0 0 auto;
        display: flex;
        border-top: 1px solid var(--border);
        min-height: 214px;
      }
      .minimap-pane {
        flex: 0 0 auto;
        padding: 6px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        border-right: 1px solid var(--border);
        background: var(--card);
      }
      .mm-label {
        font-size: 9px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .mm-canvas {
        display: block;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: #080810;
      }
      .mm-info {
        font-size: 9px;
        color: #333348;
      }

      .json-pane {
        flex: 1 1 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      details.json-section summary {
        padding: 4px 8px;
        font-size: 10px;
        color: var(--dim);
        cursor: pointer;
        background: var(--card2);
        border-bottom: 1px solid var(--border);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }
      details.json-section summary::-webkit-details-marker {
        display: none;
      }
      details.json-section summary::before {
        content: "▶";
        font-size: 8px;
        transition: transform 0.15s;
      }
      details.json-section[open] summary::before {
        transform: rotate(90deg);
      }
      details.json-section summary:hover {
        color: var(--text);
      }
      .json-pre {
        margin: 0;
        padding: 6px 10px;
        font-family: var(--font);
        font-size: 10px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
        overflow-x: auto;
        white-space: pre;
        max-height: 240px;
        overflow-y: auto;
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div id="hdr">
      <h1>Halo Scraper</h1>
      <nav style="display:flex;gap:4px;">
        <a href="/ui/debug/" style="color:var(--text);text-decoration:none;padding:2px 8px;border-radius:3px;font-size:11px;background:var(--card2);">Debug</a>
        <a href="/ui/tools/" style="color:var(--dim);text-decoration:none;padding:2px 8px;border-radius:3px;font-size:11px;">Tools</a>
      </nav>
      <span id="ws-dot" class="ws-dot err">&#9675; disconnected</span>
      <span id="msg-rate">0 msg/s</span>
      <span id="last-msg">—</span>
    </div>

    <div id="tabbar"></div>

    <div id="main">
      <div id="panel-all" class="panel active" data-tab="all">
        <div id="mini-grid"></div>
        <div class="log-panel">
          <div class="log-hdr">
            Events <span class="log-count" id="lc-all">0</span>
          </div>
          <div class="log-list" id="ll-all"></div>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      // ── Config ────────────────────────────────────────────────────────────────────
      const _origin =
        location.protocol === "file:"
          ? "http://localhost:9000"
          : location.origin;
      const WS_URL = _origin.replace(/^http/, "ws") + "/ws";
      const ROOMS_URL = _origin + "/rooms";
      const FALLBACK = ["xemu-host-01", "xemu-host-02", "xemu-host-03"];
      const MAX_LOG = 200;
      const MM_SIZE = 200;

      // Fixed map coordinate bounds [xRange, yRange].
      // Prevents minimap from zooming in on player cluster instead of showing the full playfield.
      const MAP_BOUNDS = {
        chillout: [
          [-30, 30],
          [-35, 35],
        ],
        bloodgulch: [
          [-85, 85],
          [-130, 130],
        ],
        ratrace: [
          [-30, 30],
          [-35, 35],
        ],
        damnation: [
          [-20, 20],
          [-20, 20],
        ],
        sidewinder: [
          [-60, 60],
          [-90, 90],
        ],
        facility: [
          [-20, 20],
          [-30, 30],
        ],
        boardingaction: [
          [-60, 60],
          [-15, 15],
        ],
        beavercreek: [
          [-25, 25],
          [-25, 25],
        ],
        hangemhigh: [
          [-40, 40],
          [-20, 20],
        ],
        deathisland: [
          [-80, 80],
          [-80, 80],
        ],
        gephyrophobia: [
          [-80, 80],
          [-20, 20],
        ],
        infinity: [
          [-80, 80],
          [-80, 80],
        ],
        timberland: [
          [-80, 80],
          [-80, 80],
        ],
        theflood: [
          [-60, 60],
          [-60, 60],
        ],
      };

      const WEAPON_NAMES = {
        "assault rifle": "AR",
        pistol: "Pistol",
        "sniper rifle": "Sniper",
        "rocket launcher": "Rockets",
        shotgun: "Shotgun",
        "plasma pistol": "P.Pistol",
        "plasma rifle": "P.Rifle",
        needler: "Needler",
        flamethrower: "Flamer",
        "fuel rod gun": "Fuel Rod",
        "energy sword": "Sword",
      };

      // ── State ─────────────────────────────────────────────────────────────────────
      let INSTANCES = [];
      const state = {}; // inst → State object
      const logCounts = { all: 0 };
      let activeTab = "all";
      let msgCount = 0;
      let lastRateTs = Date.now();
      let ws = null;

      // Per-instance DOM refs
      const refs = {}; // inst → { badge, mapEl, typeEl, tickEl, teamArea, powerSection, canvas, ctx, mmInfo, logList, logCount, jsonPres }
      const rowData = {}; // inst → { 0: [rows], 1: [rows], ffa: [rows] }
      const tickJsonTimer = {};

      // ── Init ──────────────────────────────────────────────────────────────────────
      async function init() {
        INSTANCES = await fetchRooms();
        INSTANCES.sort();
        for (const inst of INSTANCES) {
          state[inst] = newState();
          logCounts[inst] = 0;
        }
        buildTabBar();
        buildAllPanel();
        buildHostPanels();
        connect();
        setInterval(updateMsgRate, 1000);
      }

      function newState() {
        return {
          gameState: "menu",
          map: "—",
          gametype: "—",
          tick: 0,
          isTeamGame: false,
          teamScores: [],
          scoreLimit: 0,
          players: {}, // index → SnapshotPlayer
          tickPlayers: {}, // index → TickPlayer
          powerItems: {}, // spawn_id → PowerItemStatus
          spawns: {}, // spawn_id → PowerItemSpawn
        };
      }

      async function fetchRooms() {
        try {
          const r = await fetch(ROOMS_URL);
          if (!r.ok) throw 0;
          const list = await r.json();
          if (Array.isArray(list) && list.length) return list;
        } catch (_) {}
        return FALLBACK;
      }

      // ── WebSocket ─────────────────────────────────────────────────────────────────
      function connect() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => setWsDot(true);
        ws.onclose = () => {
          setWsDot(false);
          setTimeout(connect, 2000);
        };
        ws.onerror = () => {};
        ws.onmessage = (e) => {
          msgCount++;
          try {
            dispatch(JSON.parse(e.data));
          } catch (_) {}
        };
      }

      function setWsDot(ok) {
        const el = document.getElementById("ws-dot");
        el.innerHTML = ok ? "&#9679; connected" : "&#9675; disconnected";
        el.className = "ws-dot " + (ok ? "ok" : "err");
      }

      function updateMsgRate() {
        const dt = (Date.now() - lastRateTs) / 1000;
        document.getElementById("msg-rate").textContent =
          Math.round(msgCount / dt) + " msg/s";
        msgCount = 0;
        lastRateTs = Date.now();
      }

      // ── Dispatch ──────────────────────────────────────────────────────────────────
      function dispatch(msg) {
        const { type, instance: inst, tick, payload } = msg;
        if (!state[inst]) return;
        const s = state[inst];
        s.tick = tick;
        document.getElementById("last-msg").textContent =
          type + " #" + tick + " [" + inst + "]";

        if (type === "snapshot") {
          s.gameState = payload.game_state || "menu";
          s.map = payload.map || "—";
          s.gametype = payload.gametype || "—";
          s.isTeamGame = !!payload.is_team_game;
          s.teamScores = payload.team_scores || [];
          s.scoreLimit = payload.score_limit || 0;
          s.spawns = {};
          for (const sp of payload.power_item_spawns || [])
            s.spawns[sp.spawn_id] = sp;
          s.players = {};
          for (const p of payload.players || []) s.players[p.index] = p;
          renderSnapshot(inst);
          setRawJSON(inst, "snapshot", payload, false);
          return;
        }

        if (type === "tick") {
          s.tickPlayers = {};
          for (const p of payload.players || []) s.tickPlayers[p.index] = p;
          s.powerItems = {};
          for (const pi of payload.power_items || [])
            s.powerItems[pi.spawn_id] = pi;
          renderTick(inst);
          setRawJSON(inst, "tick", payload, true);
          return;
        }

        if (type === "event") {
          if (payload.event_type === "score") {
            const p = s.players[payload.player];
            if (p) {
              if (payload.kills != null) p.kills = payload.kills;
              if (payload.deaths != null) p.deaths = payload.deaths;
              if (payload.assists != null) p.assists = payload.assists;
              if (payload.kill_streak != null)
                p.kill_streak = payload.kill_streak;
              if (payload.multikill != null) p.multikill = payload.multikill;
              updateKDARow(inst, payload.player);
            }
          }
          appendLog(inst, tick, payload);
          setRawJSON(inst, "event", payload, false);
        }
      }

      // ── Render: Snapshot ──────────────────────────────────────────────────────────
      function renderSnapshot(inst) {
        const s = state[inst];

        r.badge.textContent = s.gameState.toUpperCase();
        r.badge.className = "badge badge-" + s.gameState + " inst-badge";
        r.mapEl.textContent = s.map;
        r.typeEl.textContent = s.gametype;
        r.tickEl.textContent = "tick: " + s.tick;
        updateMiniCard(inst);
        rebuildTeamArea(inst);

      function rebuildTeamArea(inst) {
        const s = state[inst];
        const r = refs[inst];
        r.teamArea.innerHTML = "";
        rowData[inst] = {};

        if (s.isTeamGame) {
          for (const team of [0, 1]) {
            const score = (
              s.teamScores.find((t) => t.team === team) || { score: 0 }
            ).score;
            const cls = team === 0 ? "red" : "blue";
            const label = team === 0 ? "Red" : "Blue";
            const col = mk("div", "team-col");
            const hdr = mk("div", "team-hdr " + cls);
            hdr.innerHTML =
              label +
              ' <span class="team-score" data-tscore="' +
              inst +
              "-" +
              team +
              '">' +
              score +
              "</span>";
            col.appendChild(hdr);
            col.appendChild(buildPlayerTable(inst, team, 8));
            r.teamArea.appendChild(col);
          }
        } else {
          const col = mk("div", "team-col");
          const hdr = mk("div", "team-hdr ffa");
          hdr.textContent = "Players";
          col.appendChild(hdr);
          col.appendChild(buildPlayerTable(inst, "ffa", 16));
          r.teamArea.appendChild(col);
        }

        for (const p of Object.values(s.players)) {
          setPlayerFromSnapshot(inst, p);
        }
      }

      // ── Player snapshot assignment ────────────────────────────────────────────────
      function setPlayerFromSnapshot(inst, p) {
        const s = state[inst];
        const team = s.isTeamGame ? p.team : "ffa";
        const rows = rowData[inst] && rowData[inst][team];
        if (!rows) return;

        const teamPlayers = Object.values(s.players)
          .filter((pl) => (s.isTeamGame ? pl.team === team : true))
          .sort((a, b) => a.index - b.index);

        const slot = teamPlayers.findIndex((pl) => pl.index === p.index);
        if (slot < 0 || slot >= rows.length) return;

        const row = rows[slot];
        row.tr.dataset.idx = p.index;
        row.tr.classList.remove("empty");
        row.numEl.textContent = p.index;
        row.name.textContent = p.name || "#" + p.index;
        row.name.className =
          "p-name " + (s.isTeamGame ? (p.team === 0 ? "red" : "blue") : "none");
        row.kdaK.textContent = p.kills != null ? p.kills : 0;
        row.kdaD.textContent = p.deaths != null ? p.deaths : 0;
        row.kdaA.textContent = p.assists != null ? p.assists : 0;
        row.tkEl.textContent = p.team_kills != null ? p.team_kills : 0;
        row.suiEl.textContent = p.suicides != null ? p.suicides : 0;
        row.ctfEl.textContent = p.ctf_score != null ? p.ctf_score : 0;
        row.ksEl.textContent = p.kill_streak != null ? p.kill_streak : 0;
        row.mkEl.textContent = p.multikill != null ? p.multikill : 0;
        row.accEl.textContent =
          p.shots_fired > 0
            ? Math.round((p.shots_hit / p.shots_fired) * 100) + "%"
            : "—";
      }

      function updateKDARow(inst, playerIdx) {
        const p = state[inst].players[playerIdx];
        if (!p) return;
        const row = findRow(inst, playerIdx);
        if (!row) return;
        row.kdaK.textContent = p.kills != null ? p.kills : 0;
        row.kdaD.textContent = p.deaths != null ? p.deaths : 0;
        row.kdaA.textContent = p.assists != null ? p.assists : 0;
        row.ksEl.textContent = p.kill_streak != null ? p.kill_streak : 0;
        row.mkEl.textContent = p.multikill != null ? p.multikill : 0;
      }

      function findRow(inst, playerIdx) {
        const s = state[inst];
        const sp = s.players[playerIdx];
        if (!sp) return null;
        const team = s.isTeamGame ? sp.team : "ffa";
        const rows = rowData[inst] && rowData[inst][team];
        if (!rows) return null;
        return rows.find((r) => +r.tr.dataset.idx === playerIdx) || null;
      }

      // ── Render: Tick ──────────────────────────────────────────────────────────────
      function renderTick(inst) {
        const s = state[inst];
        const r = refs[inst];
        if (!r) return;

        r.tickEl.textContent = "tick: " + s.tick;
        updateMiniCard(inst);

        for (const tp of Object.values(s.tickPlayers)) {
          const row = findRow(inst, tp.index);
          if (!row) continue;

          const alive = tp.alive;
          row.tr.classList.toggle("dead", !alive);
          row.tr.classList.remove("empty");
          row.dot.className = "p-dot " + (alive ? "alive" : "dead");

          // HP bar
          const hp = tp.health != null ? tp.health : 0;
          const hpPct = Math.min(100, Math.max(0, hp * 100));
          row.hpFill.style.width = hpPct + "%";
          row.hpFill.className =
            "bar-fill " +
            (hpPct > 50 ? "hp-hi" : hpPct > 25 ? "hp-mid" : "hp-lo");
          row.hpVal.textContent = Math.round(hpPct);

          // Shield bar
          const sh = tp.shields != null ? tp.shields : 0;
          const shPct = Math.min(100, Math.max(0, sh * 100));
          row.shFill.style.width = shPct + "%";
          row.shFill.className =
            "bar-fill " + (tp.has_overshield ? "sh-ov" : "sh-bar");
          row.shVal.textContent = Math.round(sh * 100); // may exceed 100 with overshield

          // Weapons
          const wpns = tp.weapons || [];
          const sel =
            tp.selected_weapon_slot != null ? tp.selected_weapon_slot : -1;
          renderWeaponCell(
            row.wpn0,
            wpns.find((w) => w.slot === 0),
            sel === 0,
          );
          renderWeaponCell(
            row.wpn1,
            wpns.find((w) => w.slot === 1),
            sel === 1,
          );

          // Nades
          row.ndFrag.textContent = tp.frags != null ? tp.frags : 0;
          row.ndPlas.textContent = tp.plasmas != null ? tp.plasmas : 0;

          // Action flags
          setFl(row.fl.cr, tp.is_crouching);
          setFl(row.fl.ju, tp.is_jumping);
          setFl(row.fl.fi, tp.is_firing);
          setFl(row.fl.sh, tp.is_shooting);
          setFl(row.fl.flt, tp.is_flashlight_on);
          setFl(row.fl.gr, tp.is_throwing_grenade);
          setFl(row.fl.me, tp.is_meleeing);
          setFl(row.fl.ac, tp.is_pressing_action);
          setFl(row.fl.ha, tp.is_holding_action);
          setFl(row.fl.cam, tp.has_camo);
          setFl(row.fl.os, tp.has_overshield);
          setFl(row.fl.zm, tp.zoom_level != null && tp.zoom_level !== 0);

          // Respawn countdown
          if (!alive && tp.respawn_in_ticks != null) {
            row.dotTd.innerHTML =
              '<span style="font-size:9px;color:var(--dim)">~' +
              Math.ceil(tp.respawn_in_ticks / 30) +
              "s</span>";
          } else {
            row.dotTd.innerHTML =
              '<span class="p-dot ' + (alive ? "alive" : "dead") + '"></span>';
            row.dot = row.dotTd.querySelector(".p-dot");
          }
        }

        renderPowerItems(inst);
        renderMinimap(inst);
      }

      function renderWeaponCell(cell, wpn, selected) {
        if (!wpn || !wpn.tag) {
          cell.innerHTML = '<span class="wpn-empty-txt">—</span>';
          return;
        }
        const name = shortTag(wpn.tag);
        let ammo = "";
        if (wpn.ammo_mag != null && wpn.ammo_pack != null) {
          ammo = wpn.ammo_mag + "/" + wpn.ammo_pack;
        } else if (wpn.ammo_mag != null) {
          ammo = "" + wpn.ammo_mag;
        } else if (wpn.charge != null) {
          ammo = Math.round(wpn.charge * 100) + "%";
        }
        cell.innerHTML =
          '<span class="wpn-name' +
          (selected ? " sel" : "") +
          '">' +
          escHtml(name) +
          "</span>" +
          (ammo ? ' <span class="wpn-ammo">' + ammo + "</span>" : "");
      }

      function setFl(el, on) {
        if (el) el.classList.toggle("on", !!on);
      }

      // ── Power Items ───────────────────────────────────────────────────────────────
      function renderPowerItems(inst) {
        const s = state[inst];
        const r = refs[inst];
        if (!r) return;
        r.powerSection.innerHTML = '<span class="pi-label">Items</span>';

        const items = Object.values(s.powerItems);
        if (!items.length) {
          const none = mk("span");
          none.style.cssText = "color:var(--dim);font-size:10px";
          none.textContent = "—";
          r.powerSection.appendChild(none);
          return;
        }

        for (const pi of items) {
          const spawn = s.spawns[pi.spawn_id];
          const name = spawn ? shortTag(spawn.tag) : "spawn " + pi.spawn_id;
          const badge = mk("div", "pi-badge " + (pi.status || "world"));
          let info = "";
          if (pi.status === "held" && pi.held_by != null) {
            const holder = s.players[pi.held_by];
            info = holder ? holder.name : "#" + pi.held_by;
          } else if (
            pi.status === "respawning" &&
            pi.respawn_in_ticks != null
          ) {
            info = "~" + Math.round(pi.respawn_in_ticks / 30) + "s";
          }
          badge.innerHTML =
            '<span class="pi-dot"></span>' +
            '<span class="pi-name">' +
            escHtml(name) +
            "</span>" +
            (info ? '<span class="pi-info"> ' + escHtml(info) + "</span>" : "");
          r.powerSection.appendChild(badge);
        }
      }

      // ── Minimap ───────────────────────────────────────────────────────────────────
      function renderMinimap(inst) {
        const s = state[inst];
        const r = refs[inst];
        const ctx = r.ctx;
        ctx.clearRect(0, 0, MM_SIZE, MM_SIZE);

        // Subtle grid
        ctx.strokeStyle = "#1e1e30";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const v = (i * MM_SIZE) / 4 + 0.5;
          ctx.beginPath();
          ctx.moveTo(v, 0);
          ctx.lineTo(v, MM_SIZE);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, v);
          ctx.lineTo(MM_SIZE, v);
          ctx.stroke();
        }

        const bounds = getMapBounds(s.map);
        r.mmInfo.textContent =
          s.map + "  x[" + bounds[0] + "]  y[" + bounds[1] + "]";

        for (const tp of Object.values(s.tickPlayers)) {
          const [cx, cy] = worldToCanvas(tp.x, tp.y, bounds);
          const sp = s.players[tp.index];
          const color =
            s.isTeamGame && sp
              ? sp.team === 0
                ? "#e05050"
                : "#4d9fff"
              : "#aaaacc";

          // Aim direction line
          ctx.globalAlpha = tp.alive ? 0.45 : 0.15;
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + tp.aim_x * 12, cy - tp.aim_y * 12);
          ctx.stroke();

          // Player dot
          ctx.globalAlpha = tp.alive ? 1 : 0.25;
          ctx.beginPath();
          ctx.arc(cx, cy, tp.alive ? 4 : 3, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function getMapBounds(mapName) {
        const name = String(mapName || "").toLowerCase().split(/[\/\\]/).pop();
        const b = MAP_BOUNDS[name];
        return b || [[-100, 100], [-100, 100]];
      }

      function worldToCanvas(wx, wy, bounds) {
        const [[minX, maxX], [minY, maxY]] = bounds;
        const cx = ((wx - minX) / (maxX - minX)) * MM_SIZE;
        const cy = MM_SIZE - ((wy - minY) / (maxY - minY)) * MM_SIZE;
        return [cx, cy];
      }

      // ── Event Log ─────────────────────────────────────────────────────────────────
      function appendLog(inst, tick, payload) {
        const type = payload.event_type || "?";
        const desc = fmtEvent(payload, state[inst]);

        const r = refs[inst];
        if (r) {
          prependEntry(r.logList, tick, type, desc);
          logCounts[inst] = (logCounts[inst] || 0) + 1;
          r.logCount.textContent = logCounts[inst];
          trimLog(r.logList);
        }

        const ll = document.getElementById("ll-all");
        prependEntry(ll, tick, type, desc);
        logCounts.all++;
        document.getElementById("lc-all").textContent = logCounts.all;
        trimLog(ll);
      }

      function prependEntry(list, tick, type, desc) {
        const e = mk("div", "log-entry");
        e.innerHTML =
          '<span class="log-tick">#' +
          tick +
          "</span>" +
          '<span class="log-type ev-' +
          type +
          '">' +
          type +
          "</span>" +
          '<span class="log-desc">' +
          escHtml(desc) +
          "</span>";
        list.insertBefore(e, list.firstChild);
      }

      function trimLog(list) {
        while (list.children.length > MAX_LOG) list.removeChild(list.lastChild);
      }

      function fmtEvent(p, s) {
        const n = (idx) =>
          (s && s.players && s.players[idx] && s.players[idx].name) ||
          "#" + idx;
        switch (p.event_type) {
          case "kill":
            return n(p.killer) + " killed " + n(p.victim);
          case "death":
            return n(p.player) + " died";
          case "spawn":
            return n(p.player) + " spawned";
          case "damage":
            return (
              n(p.dealer != null ? p.dealer : -1) +
              " -> " +
              n(p.receiver) +
              (p.amount != null ? "  " + p.amount.toFixed(1) + "dmg" : "")
            );
          case "melee":
            return (
              n(p.player) +
              " melee" +
              (p.victim != null ? " -> " + n(p.victim) : "")
            );
          case "team_kill":
            return n(p.killer) + " TK " + n(p.victim);
          case "score":
            return (
              n(p.player) +
              "  K" +
              (p.kills ?? "?") +
              "/D" +
              (p.deaths ?? "?") +
              "/A" +
              (p.assists ?? "?")
            );
          case "kill_streak":
            return n(p.player) + "  " + p.count + "-kill streak";
          case "multikill":
            return n(p.player) + "  x" + p.count + " multikill";
          case "vehicle_entered":
            return n(p.player) + " entered vehicle";
          case "vehicle_exited":
            return n(p.player) + " exited vehicle";
          case "grenade_thrown":
            return n(p.player) + " threw " + (p.kind || "grenade");
          case "powerup_picked_up":
            return n(p.player) + " picked up " + (p.kind || "?");
          case "powerup_expired":
            return (p.kind || "?") + " expired (" + n(p.player) + ")";
          case "item_picked_up":
            return n(p.player) + " picked up " + shortTag(p.tag || "");
          case "item_dropped":
            return (
              (p.player != null ? n(p.player) : "?") +
              " dropped " +
              shortTag(p.tag || "")
            );
          case "item_spawned":
            return shortTag(p.tag || "") + " spawned";
          case "item_depleted":
            return n(p.player) + " depleted " + shortTag(p.tag || "");
          case "player_quit":
            return n(p.player) + " quit";
          case "game_start":
            return (
              "game started — " + (p.map || "?") + " " + (p.gametype || "")
            );
          case "game_end":
            return "game ended";
          default:
            return JSON.stringify(p);
        }
      }

      // ── Raw JSON Inspector ────────────────────────────────────────────────────────
      function setRawJSON(inst, type, payload, throttled) {
        const r = refs[inst];
        if (!r) return;
        const pre = r.jsonPres[type];
        if (!pre) return;
        if (throttled) {
          if (tickJsonTimer[inst]) return;
          tickJsonTimer[inst] = setTimeout(() => {
            pre.textContent = JSON.stringify(payload, null, 2);
            tickJsonTimer[inst] = null;
          }, 250);
          return;
        }
        pre.textContent = JSON.stringify(payload, null, 2);
      }

      // ── Helpers ───────────────────────────────────────────────────────────────────
      function mk(tag, cls) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function shortTag(tag) {
        if (!tag) return "—";
        const last = tag
          .split(/[\\\/]/)
          .pop()
          .toLowerCase();
        return WEAPON_NAMES[last] || last;
      }

      init();
    </script>
  </body>
</html>
