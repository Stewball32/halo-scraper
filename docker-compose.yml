---
# ============================================================================
# xemu + halo-scraper — minimal multi-instance compose
# ============================================================================
# Two services per instance: xemu (with embedded halo-scraper) + relay (socat)
#
# Usage:
#   docker compose --env-file .env.1 up -d   # instance 1
#   docker compose --env-file .env.2 up -d   # instance 2
#   docker compose --env-file .env.3 up -d   # instance 3
#
# SSH tunnels (from workstation):
#   ssh -L 731:127.0.0.1:${XBDM_PORT} -L 21:127.0.0.1:${FTP_PORT} user@server
#   Assembly → localhost:731  |  FTP → localhost:21 (active mode only)
# ============================================================================

networks:
  xemu_lan:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${BRIDGE_NAME}
    ipam:
      config:
        - subnet: ${SUBNET}
          gateway: ${GATEWAY}

services:
  xemu:
    build:
      context: ..
      dockerfile: cairo-station-LAN/services/xemu/Dockerfile
    image: xemu-bridged:latest
    container_name: xemu-${INSTANCE}
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/uinput:/dev/uinput
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
      - DISABLE_ZINK=true
      - DISABLE_DRI3=true
      - SELKIES_GAMEPAD_ENABLED=true
    volumes:
      - ${DATA_DIR}:/config
      - ./services/xemu/init:/custom-cont-init.d
      - ./services/xemu/data/halo-scraper/halo-scraper.toml:/opt/halo-scraper/halo-scraper.toml:ro
    ports:
      - "127.0.0.1:${HTTP_PORT}:3000"
      - "127.0.0.1:${HTTPS_PORT}:3001"
      - "127.0.0.1:${QMP_PORT}:4444"
      - "127.0.0.1:${SCRAPER_PORT}:9000"
    networks:
      xemu_lan:
        ipv4_address: ${XEMU_IP}
    shm_size: "1gb"
    restart: unless-stopped

  relay:
    # Relays XBDM (731 → Xbox debug IP) and FTP (21 → Xbox title IP).
    # ethtool tx off is critical: without it the Xbox silently drops all TCP
    # while ICMP ping still works (kernel computes ICMP checksums in software).
    image: alpine/socat
    container_name: relay-${INSTANCE}
    entrypoint: sh
    command: >
      -c "apk add --no-cache ethtool socat > /dev/null 2>&1;
          ethtool -K eth0 tx off 2>/dev/null || true;
          socat TCP-LISTEN:731,reuseaddr,fork TCP:${XBOX_DEBUG_IP}:731 &
          exec socat TCP-LISTEN:21,reuseaddr,fork TCP:${XBOX_TITLE_IP}:21"
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:${XBDM_PORT}:731"
      - "127.0.0.1:${FTP_PORT}:21"
    networks:
      xemu_lan:
        ipv4_address: ${RELAY_IP}
    depends_on:
      - xemu
    restart: unless-stopped
